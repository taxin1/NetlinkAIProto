name: networklink_ai
description: Netlink AI - AI-powered professional networking platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  image_picker: ^1.2.1
  cobe_flutter: any
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  qr_flutter: ^4.1.0
  flutter_web_plugins:
    sdk: flutter
  file_picker: ^12.2.0
  crypto: ^3.0.7
  http: ^1.2.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf


