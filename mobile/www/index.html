<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Netlink AI</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: #fff;
        padding: 24px;
        text-align: center;
      }

      .card {
        max-width: 360px;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }

      p {
        opacity: 0.9;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Netlink AI</h1>
      <p>Connecting to Network Link AI…</p>
      <p style="margin-top: 12px; font-size: 0.875rem; opacity: 0.75">
        If this screen stays visible, check your internet connection.
      </p>
    </div>
  </body>
</html>
